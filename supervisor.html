<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flag Queue – Duplication Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">HCM</span><span>DIGIT HCM</span></div>

      <span>Solimbo</span>
